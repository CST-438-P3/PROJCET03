openapi: 3.1.0
info:
  title: PROJECT03 API
  version: 0.1.0
  description: Contract-first. Change this file in a PR *before* the controller that implements it.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /auth/github:
    post:
      summary: Exchange a GitHub authorization code (PKCE) for an API JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeExchange' }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { description: Verified email already registered via the other provider, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /auth/google:
    post:
      summary: Exchange a Google authorization code (PKCE) for an API JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeExchange' }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { description: Verified email already registered via the other provider, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /users/me:
    get:
      summary: Current user's profile
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete account and all of the user's data
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    CodeExchange:
      type: object
      required: [code, codeVerifier, redirectUri]
      properties:
        code: { type: string }
        codeVerifier: { type: string }
        redirectUri: { type: string, format: uri }
    Session:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: API-issued JWT, short-lived }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [USER, ADMIN] }
    Problem:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

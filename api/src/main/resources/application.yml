spring:
  application:
    name: api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:app}?sslmode=${DATABASE_SSLMODE:disable}}
    username: ${DATABASE_USERNAME:app}
    password: ${DATABASE_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}

app:
  # HMAC key for the API's own JWTs. Must be >= 32 bytes. Never commit a real one.
  jwt-secret: ${JWT_SECRET}
  jwt-ttl: ${JWT_TTL:PT15M}
  cors-origins: ${CORS_ORIGINS:http://localhost:8081}
  google:
    # Empty values make Google sign-in fail closed (401) without stopping the app.
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    token-uri: https://oauth2.googleapis.com/token
    jwks-uri: https://www.googleapis.com/oauth2/v3/certs
  # Enable only for local/demo environments until OAuth is wired into the app.
  public-nearby: ${PUBLIC_NEARBY:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    # Serve the hand-written contract, not the generated one.
    url: /openapi.yaml

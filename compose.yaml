# Local stack: Postgres + the Spring Boot API. Run from the repo root:
#   docker compose up --build
# Then open http://localhost:8080/actuator/health and look for {"status":"UP"}.
# Values come from .env if you made one (see .env.example); the defaults below work without it.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: app
      DATABASE_USERNAME: app
      DATABASE_PASSWORD: app
      # A local-only key. Production uses a different one set in Render.
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-at-least-32-bytes}
      CORS_ORIGINS: http://localhost:8081
      # Lets the web app search without signing in, for local runs only.
      PUBLIC_NEARBY: "true"
      # Live Rescue Groups data instead of the 3 fake pets: set both in .env (see .env.example).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      RESCUE_GROUPS_API_KEY: ${RESCUE_GROUPS_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

volumes:
  db-data:
